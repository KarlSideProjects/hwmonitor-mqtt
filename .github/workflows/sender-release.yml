name: Sender release WIP
run-name: sender-recovery-${{ inputs.source || github.sha }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source:
        description: 'First-parent master source to recover'
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.source != ''))
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source identity and derive version
        id: identity
        env:
          SOURCE: ${{ inputs.source || github.sha }}
          MASTER: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$MASTER"
          VERSION=$(python3 scripts/release_version.py --master "$MASTER" "$SOURCE")
          printf '%s\n' "source=$SOURCE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "version=$VERSION" >> "$GITHUB_OUTPUT"
  checks:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.source }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          version: '0.13.6'
      - run: make check

  linux-build:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            image: python@sha256:9e25f400253a5fa3191813d6a67eb801ca1e6f012b3bd2588fa6920b59e3eba6
            python-archive: cpython-3.11.15%2B20260728-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
            python-sha: 39dfd79560d9b0c22ce7d16bccc171ed93537331a8c26a8aebe960301621b65e
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            image: debian@sha256:29e60bc6b8355ce47307cecadb843f25c9a1ee332ed8458039cc435262677bdc
            python-archive: cpython-3.11.15%2B20260728-aarch64-unknown-linux-gnu-install_only_stripped.tar.gz
            python-sha: a6decd180099e6768269bd8e8968aeaa84bb01511f00f6921dc204fe648729aa
    env:
      SOURCE: ${{ needs.version.outputs.source }}
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.platform }}
      BUILD_IMAGE: ${{ matrix.image }}
      PYTHON_ARCHIVE: ${{ matrix.python-archive }}
      PYTHON_SHA: ${{ matrix.python-sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.version.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build from the pinned native toolchain
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE"
          curl --fail --location --retry 3 "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/$PYTHON_ARCHIVE" -o "$RUNNER_TEMP/python.tar.gz"
          printf '%s  %s\n' "$PYTHON_SHA" "$RUNNER_TEMP/python.tar.gz" | sha256sum -c -
          RUNNER_UID=$(id -u) RUNNER_GID=$(id -g)
          export RUNNER_UID RUNNER_GID
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP:/work" -w /src -e VERSION -e RUNNER_UID -e RUNNER_GID "$BUILD_IMAGE" bash -ec '
            printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y --no-install-recommends git gcc=4:10.2.1-1 gcc-10=10.2.1-6 libc6-dev=2.31-13+deb11u14 patchelf=0.12-1
            git config --global --add safe.directory /src
            mkdir -p /opt/pbs /work/result
            tar -xzf /work/python.tar.gz -C /opt/pbs --strip-components=1
            /opt/pbs/bin/python3.11 -m venv /tmp/build-venv
            /tmp/build-venv/bin/pip install --no-build-isolation --require-hashes --force-reinstall -r scripts/requirements-sender-build.txt
            /tmp/build-venv/bin/python scripts/build_sender_package.py --version "$VERSION" --output /work/result
            chown -R "$RUNNER_UID:$RUNNER_GID" /work/result
          '
      - name: Build image and independent build record
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/private/evidence/$TARGET" "$RUNNER_TEMP/private/assets"
          python3 -c 'import os, tarfile; p=os.environ["RUNNER_TEMP"]; t=os.environ["TARGET"]; tarfile.open(f"{p}/result/sender-{t}.tar.gz").extractall(f"{p}/candidate", filter="data")'
          docker build -t sender-release-candidate:local "$RUNNER_TEMP/candidate"
          docker save sender-release-candidate:local -o "$RUNNER_TEMP/private/evidence/$TARGET/image.tar"
          cp "$RUNNER_TEMP/result/sender-$TARGET.tar.gz"* "$RUNNER_TEMP/private/assets/"
          cp -a "$RUNNER_TEMP/result/evidence/." "$RUNNER_TEMP/private/evidence/$TARGET/"
          python3 scripts/create_sender_build_record.py --source-root . --platform "$TARGET" \
            --archive "$RUNNER_TEMP/private/assets/sender-$TARGET.tar.gz" --executable "$RUNNER_TEMP/candidate/sender" \
            --report "$RUNNER_TEMP/private/evidence/$TARGET/report.xml" --inventory "$RUNNER_TEMP/private/evidence/$TARGET/inventory.json" \
            --provenance "$RUNNER_TEMP/private/evidence/$TARGET/provenance.json" --runtime-dir "$RUNNER_TEMP/private/evidence/$TARGET/runtime" \
            --assets "$RUNNER_TEMP/private/assets" --image "$RUNNER_TEMP/private/evidence/$TARGET/image.tar" \
            --version "$VERSION" --python-version 3.11.15 --output "$RUNNER_TEMP/private/evidence/$TARGET/record.json"
      # Native installer and MQTT acceptance must run here before upload; harness is in progress.
      - name: Block until native release acceptance is wired
        run: exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sender-${{ matrix.platform }}-${{ needs.version.outputs.source }}
          path: ${{ runner.temp }}/private
          if-no-files-found: error
          retention-days: 3

  windows-build:
    needs: version
    uses: ./.github/workflows/protected-windows-package.yml
    with:
      source: ${{ needs.version.outputs.source }}
      version: ${{ needs.version.outputs.version }}

  prepare:
    needs: [version, checks, linux-build, windows-build]
    runs-on: ubuntu-latest
    environment: sender-release-publisher
    concurrency:
      group: sender-prepare-${{ needs.version.outputs.source }}
      queue: max
    env:
      SOURCE: ${{ needs.version.outputs.source }}
      VERSION: ${{ needs.version.outputs.version }}
      MASTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sender-linux-x64-${{ needs.version.outputs.source }}
          path: ${{ runner.temp }}/x64
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sender-linux-arm64-${{ needs.version.outputs.source }}
          path: ${{ runner.temp }}/arm64
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sender-windows-x64-${{ needs.version.outputs.source }}
          path: ${{ runner.temp }}/windows
      - name: Assemble exact source-bound asset set
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/assets" "$RUNNER_TEMP/evidence"
          python3 -c '
          import os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          sets={"x64": ["sender-linux-x64.tar.gz"], "arm64": ["sender-linux-arm64.tar.gz"], "windows": ["sender-windows-x64.zip", "validate_sender_package.ps1", "activate_sender_package.ps1"]}
          for platform,names in sets.items():
              source=root/platform
              assert source.is_dir() and not source.is_symlink()
              for p in source.rglob("*"):
                  assert not p.is_symlink() and (p.is_file() or p.is_dir())
              assert {p.name for p in (source/"assets").iterdir()} == set(names) | {n+".sha256" for n in names}
              assert {p.name for p in (source/"evidence").iterdir()} == {"linux-x64" if platform == "x64" else "linux-arm64" if platform == "arm64" else "windows-x64"}
          '
          for platform in x64 arm64 windows; do
            cp -a "$RUNNER_TEMP/$platform/assets/." "$RUNNER_TEMP/assets/"
            cp -a "$RUNNER_TEMP/$platform/evidence/." "$RUNNER_TEMP/evidence/"
          done
          git show "$SOURCE:bootstrap.sh" > "$RUNNER_TEMP/assets/install.sh"
          git show "$SOURCE:bootstrap.ps1" > "$RUNNER_TEMP/assets/install.ps1"
          (cd "$RUNNER_TEMP/assets"; sha256sum install.sh > install.sh.sha256; sha256sum install.ps1 > install.ps1.sha256)
          python3 -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "assets/version.json").write_text(json.dumps({"source":os.environ["SOURCE"],"version":os.environ["VERSION"]})+"\n")'
      - name: Inspect all platforms and stage a draft
        env:
          SENDER_RELEASE_TOKEN: ${{ secrets.SENDER_RELEASE_TOKEN }}
        run: python3 scripts/release_controller.py prepare --master "$MASTER" --source "$SOURCE" --assets "$RUNNER_TEMP/assets" --evidence "$RUNNER_TEMP/evidence"

  recover:
    if: github.ref == 'refs/heads/master' && github.event_name == 'schedule' && vars.SENDER_RELEASE_ACTIVATION_SHA != ''
    runs-on: ubuntu-latest
    environment: sender-release-publisher
    permissions:
      contents: read
      actions: write
    env:
      MASTER: ${{ github.sha }}
      START: ${{ vars.SENDER_RELEASE_ACTIVATION_SHA }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retry a bounded set of missing sources
        env:
          SENDER_RELEASE_TOKEN: ${{ secrets.SENDER_RELEASE_TOKEN }}
          SOURCE_WORKFLOW_TOKEN: ${{ github.token }}
        run: python3 scripts/release_controller.py recover --master "$MASTER" --start "$START"

  # A scheduled or manual drain can recover READY drafts after interrupted runs.
  publisher:
    needs: prepare
    if: ${{ always() && github.ref == 'refs/heads/master' && (needs.prepare.result == 'success' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source == '')) }}
    runs-on: ubuntu-latest
    environment: sender-release-publisher
    concurrency:
      group: sender-publisher
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reconcile validated READY drafts
        env:
          SENDER_RELEASE_TOKEN: ${{ secrets.SENDER_RELEASE_TOKEN }}
        run: python3 scripts/release_controller.py drain
