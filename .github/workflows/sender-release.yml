name: Sender release WIP

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source identity and derive version
        env:
          SOURCE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python3 scripts/release_version.py --master "$SOURCE" "$SOURCE"
      - name: Keep release blocked until producer and legal gates exist
        run: |
          echo 'publication is disabled: platform evidence and independent legal inspection are not wired'
          exit 1

  # Disabled until the protected inspector can produce a trusted receipt.
  prepare:
    if: ${{ false }}
    needs: version
    runs-on: ubuntu-latest
    concurrency:
      group: sender-prepare-${{ github.sha }}
      queue: max
    steps:
      - run: exit 1

  # A scheduled or manual drain can recover READY drafts after interrupted runs.
  publisher:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: sender-release-publisher
    concurrency:
      group: sender-publisher
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reconcile validated READY drafts
        env:
          SENDER_RELEASE_TOKEN: ${{ secrets.SENDER_RELEASE_TOKEN }}
        run: python3 scripts/release_controller.py drain
