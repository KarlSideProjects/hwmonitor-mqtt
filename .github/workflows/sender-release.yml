name: Sender release WIP

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source identity and derive version
        env:
          SOURCE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python3 scripts/release_version.py --master "$SOURCE" "$SOURCE"
      - name: Keep release blocked until producer and legal gates exist
        run: |
          echo 'publication is disabled: platform evidence and independent legal inspection are not wired'
          exit 1

  # Disabled until the protected inspector can produce a trusted receipt.
  prepare:
    if: ${{ false }}
    needs: version
    runs-on: ubuntu-latest
    concurrency:
      group: sender-prepare-${{ github.sha }}
      queue: max
    steps:
      - run: exit 1

  # READY drafts are durable; a later drain must recover queue overflow.
  publisher:
    if: ${{ false }}
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: sender-publisher
      queue: max
    steps:
      - run: exit 1
