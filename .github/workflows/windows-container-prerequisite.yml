name: Private Windows container prerequisite QA
on:
  push:
    branches: [qa/windows-container-prerequisite-20261031]
permissions:
  contents: read
  actions: read
jobs:
  prerequisite:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 9f0e77a9481eb232bdbe5b22e9ef494ded774bbe
          path: qa-helper-source
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sender-windows-x64-da634ab491076353d769681292ff174c9abfd3c5
          run-id: 41148709956
          github-token: ${{ github.token }}
          path: qa-artifact
      - name: Exercise prerequisite in isolated container
        shell: pwsh
        run: ./tests/windows_container_prerequisite.ps1 -ArtifactDir "$env:GITHUB_WORKSPACE/qa-artifact" -HelperDir "$env:GITHUB_WORKSPACE/qa-helper-source" -EvidenceDir "$env:RUNNER_TEMP/container-qa-evidence"
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-container-prerequisite-evidence
          path: ${{ runner.temp }}/container-qa-evidence/
          if-no-files-found: error
          retention-days: 3
