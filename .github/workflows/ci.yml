name: Sender checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        required: true
        type: string

permissions:
  contents: read

jobs:
  flow-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate explicit source SHA
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          if [[ -n "$SOURCE" ]]; then
            [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate selected source flows
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          FLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$SOURCE" ]]; then
            [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
            [[ "$(git rev-parse HEAD)" == "$SOURCE" ]]
            FLOW_BASE=$(git rev-parse HEAD^)
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            FLOW_BASE=$(git rev-parse HEAD^)
          fi
          [[ "$FLOW_BASE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$FLOW_BASE" != 0000000000000000000000000000000000000000 ]]
          python3 tools/flow-docs/flow_checker.py explain --base "$FLOW_BASE"
          python3 tools/flow-docs/flow_checker.py check --base "$FLOW_BASE"

  tests:
    needs: flow-docs
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - name: Confirm Linux PowerShell test prerequisite
        run: pwsh --version
      - name: Install locked dependencies
        run: uv sync --locked --python "$UV_PYTHON"
      - name: Run sender checks
        run: make check

  source-bootstrap:
    needs: flow-docs
    name: Source bootstrap integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Execute source bootstrap integration fixtures
        run: uv run --locked pytest -q tests/test_source_bootstrap.py tests/test_source_acceptance.py

  native-install-smoke:
    needs: flow-docs
    name: Native systemd and MQTT smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - name: Install local broker and venv support
        run: |
          sudo apt-get update
          sudo apt-get install --yes mosquitto python3-venv
      - name: Install locked dependencies
        run: uv sync --locked --python "$(command -v python3)"
      - name: Verify systemd is available
        run: test -d /run/systemd/system
      - name: Verify DynamicUser can reach Python 3.13 base executable
        run: |
          sudo env PATH="$PATH" UV_PYTHON="$(command -v python3)" "$(command -v uv)" run --locked python -c '
          import pathlib, sys
          base = pathlib.Path(sys._base_executable).resolve()
          assert sys.version_info[:2] == (3, 13), sys.version
          assert "/opt/hostedtoolcache/" in str(base), base
          assert base.stat().st_mode & 0o005 == 0o005, base
          assert all(parent.stat().st_mode & 0o001 for parent in base.parents if parent != pathlib.Path("/")), base
          print(f"Python {sys.version.split()[0]} base executable is accessible to DynamicUser: {base}")
          '
      - name: Install and observe isolated native sender
        run: sudo env PATH="$PATH" UV_PYTHON="$(command -v python3)" "$(command -v uv)" run --locked python scripts/native_install_smoke.py --run

  windows-sender:
    needs: flow-docs
    name: Windows sender (PowerShell 5.1 and 7, LHM load)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: PowerShell tests under Windows PowerShell 5.1
        env:
          PWSH_EXE: powershell.exe
        shell: pwsh
        run: |
          uv run --locked pytest -q tests/test_powershell_syntax.py tests/test_remote_bootstrap.py -k powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceTests = @(Get-ChildItem tests/test_windows_source_*.py | ForEach-Object { $_.FullName })
          uv run --locked pytest -q @sourceTests tests/test_windows_compiled_start.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell tests under PowerShell 7
        env:
          PWSH_EXE: pwsh
        shell: pwsh
        run: |
          uv run --locked pytest -q tests/test_powershell_syntax.py tests/test_remote_bootstrap.py -k powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceTests = @(Get-ChildItem tests/test_windows_source_*.py | ForEach-Object { $_.FullName })
          uv run --locked pytest -q @sourceTests tests/test_windows_compiled_start.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows sender unit tests
        run: uv run --locked pytest -q tests/test_windows_sender_profile.py
      # The real installer path: pinned LHM hash, PawnIO silent install, SYSTEM task registration.
      - name: Run the Windows installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\install_windows_sender_task.ps1 -ProjectRoot "$PWD" -AtStartup
      - name: Scheduled task points at the installed LHM executable
        shell: powershell
        run: |
          $expected = '-LhmPath "' + (Join-Path $PWD 'third_party\librehardwaremonitor\LibreHardwareMonitor.exe') + '"'
          $actual = (Get-ScheduledTask HWMonitorMQTTSender).Actions.Arguments
          Write-Output $actual
          if (-not $actual.EndsWith($expected)) { throw "Task arguments do not end with $expected" }
      - name: Load LibreHardwareMonitorLib through pythonnet
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe -c "import json, subprocess, sys; r = subprocess.run([sys.executable, '-m', 'hwmonitor_mqtt.agents.agent_sender_windows', '--dump-sensors'], capture_output=True, text=True); print(r.stderr); assert r.returncode == 0 and 'available: True' in r.stderr, r.stderr; n = len(json.loads(r.stdout)['sensors']); print(n, 'sensors'); assert n > 0"
