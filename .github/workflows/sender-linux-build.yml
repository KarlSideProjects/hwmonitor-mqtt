name: Sender Linux compiled build WIP

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      version:
        required: true
        type: string
      platform:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      SOURCE: ${{ inputs.source }}
      OLD_SOURCE: c40a66d16d23ba7fac7fba171d02e4959a9a91a9
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.platform }}
      BUILD_IMAGE: ${{ inputs.platform == 'linux-arm64' && 'debian@sha256:29e60bc6b8355ce47307cecadb843f25c9a1ee332ed8458039cc435262677bdc' || 'python@sha256:9e25f400253a5fa3191813d6a67eb801ca1e6f012b3bd2588fa6920b59e3eba6' }}
      PYTHON_ARCHIVE: ${{ inputs.platform == 'linux-arm64' && 'cpython-3.11.15%2B20260728-aarch64-unknown-linux-gnu-install_only_stripped.tar.gz' || 'cpython-3.11.15%2B20260728-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz' }}
      PYTHON_SHA: ${{ inputs.platform == 'linux-arm64' && 'a6decd180099e6768269bd8e8968aeaa84bb01511f00f6921dc204fe648729aa' || '39dfd79560d9b0c22ce7d16bccc171ed93537331a8c26a8aebe960301621b65e' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Build from the pinned native toolchain
        run: |
          set -eu
          case "$TARGET" in linux-x64|linux-arm64) ;; *) exit 1 ;; esac
          test "$(git -C source rev-parse HEAD)" = "$SOURCE"
          test "$SOURCE" != "$OLD_SOURCE"
          curl --fail --location --retry 3 "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/$PYTHON_ARCHIVE" -o "$RUNNER_TEMP/python.tar.gz"
          printf '%s  %s\n' "$PYTHON_SHA" "$RUNNER_TEMP/python.tar.gz" | sha256sum -c -
          PYTHON_FILE=${PYTHON_ARCHIVE//%2B/+}
          mv "$RUNNER_TEMP/python.tar.gz" "$RUNNER_TEMP/$PYTHON_FILE"
          export PYTHON_FILE
          RUNNER_UID=$(id -u) RUNNER_GID=$(id -g)
          export RUNNER_UID RUNNER_GID
          docker run --rm -v "$GITHUB_WORKSPACE/source:/src" -v "$RUNNER_TEMP:/work" -w /src -e VERSION -e SOURCE -e TARGET -e PYTHON_FILE -e OLD_SOURCE -e RUNNER_UID -e RUNNER_GID "$BUILD_IMAGE" bash -ec '
            printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y --no-install-recommends git gcc=4:10.2.1-1 gcc-10=10.2.1-6 libc6-dev=2.31-13+deb11u14 patchelf=0.12-1
            git config --global --add safe.directory /src
            mkdir -p /opt/pbs /work/result
            tar -xzf "/work/$PYTHON_FILE" -C /opt/pbs --strip-components=1
            /opt/pbs/bin/python3.11 -m venv /tmp/build-venv
            mkdir /work/selected-packages
            /tmp/build-venv/bin/pip download --no-cache-dir --no-deps --no-build-isolation --require-hashes -r scripts/requirements-sender-build.txt -d /work/selected-packages
            /tmp/build-venv/bin/pip install --no-cache-dir --no-index --find-links /work/selected-packages --no-build-isolation --require-hashes --force-reinstall -r scripts/requirements-sender-build.txt
            /tmp/build-venv/bin/python scripts/build_sender_package.py --version "$VERSION" --output /work/result
            /tmp/build-venv/bin/python scripts/sender_build_inputs.py --packages /work/selected-packages --runtime "/work/$PYTHON_FILE" --runtime-kind runtime-install --platform "$TARGET" --source "$SOURCE" --version "$VERSION" --inventory /work/result/evidence/inventory.json --output /work/result/evidence/input-receipt.json
            git clone --quiet --no-checkout --shared /src /work/old-source
            git -C /work/old-source checkout --quiet --detach "$OLD_SOURCE"
            cd /work/old-source
            /tmp/build-venv/bin/pip install --no-build-isolation --require-hashes --force-reinstall -r scripts/requirements-sender-build.txt
            /tmp/build-venv/bin/python scripts/build_sender_package.py --version 0.0.1 --output /work/old-result
            chown -R "$RUNNER_UID:$RUNNER_GID" /work/result /work/old-result
          '
      - name: Build image and independent build record
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/private/evidence/$TARGET" "$RUNNER_TEMP/private/assets"
          python3 -c 'import os, tarfile; p=os.environ["RUNNER_TEMP"]; t=os.environ["TARGET"]; tarfile.open(f"{p}/result/sender-{t}.tar.gz").extractall(f"{p}/candidate", filter="data")'
          docker build -t sender-release-candidate:local "$RUNNER_TEMP/candidate"
          docker save sender-release-candidate:local -o "$RUNNER_TEMP/private/evidence/$TARGET/image.tar"
          cp "$RUNNER_TEMP/result/sender-$TARGET.tar.gz"* "$RUNNER_TEMP/private/assets/"
          cp -a "$RUNNER_TEMP/result/evidence/." "$RUNNER_TEMP/private/evidence/$TARGET/"
          python3 scripts/create_sender_build_record.py --source-root source --platform "$TARGET" \
            --archive "$RUNNER_TEMP/private/assets/sender-$TARGET.tar.gz" --executable "$RUNNER_TEMP/candidate/sender" \
            --report "$RUNNER_TEMP/private/evidence/$TARGET/report.xml" --inventory "$RUNNER_TEMP/private/evidence/$TARGET/inventory.json" \
            --provenance "$RUNNER_TEMP/private/evidence/$TARGET/provenance.json" --input-receipt "$RUNNER_TEMP/private/evidence/$TARGET/input-receipt.json" --runtime-dir "$RUNNER_TEMP/private/evidence/$TARGET/runtime" \
            --assets "$RUNNER_TEMP/private/assets" --image "$RUNNER_TEMP/private/evidence/$TARGET/image.tar" \
            --version "$VERSION" --python-version 3.11.15 --output "$RUNNER_TEMP/private/evidence/$TARGET/record.json"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          version: '0.13.6'
      - name: Exercise compiled installer failure cases
        env:
          HWMONITOR_TEST_ARCHIVE: ${{ runner.temp }}/private/assets/sender-${{ inputs.platform }}.tar.gz
        run: |
          set -eu
          docker build -t protected21-bootstrap-test:local -f scripts/release-tests/Dockerfile.installer-double scripts/release-tests
          cd source
          uv run --locked pytest -q tests/test_compiled_bootstrap_integration.py --junitxml="$RUNNER_TEMP/compiled-tests.xml"
          python3 -c '
          import os, xml.etree.ElementTree as ET
          suites = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "compiled-tests.xml")).getroot().iter("testsuite")
          tests, skipped = 0, 0
          for suite in suites:
              tests += int(suite.get("tests", "0"))
              skipped += int(suite.get("skipped", "0"))
          expected_skips = 1 if os.environ["TARGET"] == "linux-arm64" else 0
          assert tests > expected_skips and skipped == expected_skips, (tests, skipped, expected_skips)
          '
      - name: Verify distinct baseline archive checksum
        run: (cd "$RUNNER_TEMP/old-result"; sha256sum -c "sender-$TARGET.tar.gz.sha256")
      - name: Exercise compiled Docker install, upgrade, MQTT and rollback
        run: |
          set -eu
          archive="$RUNNER_TEMP/private/assets/sender-$TARGET.tar.gz"
          old="$RUNNER_TEMP/old-result/sender-$TARGET.tar.gz"
          python3 scripts/release-tests/docker_acceptance.py --bootstrap "$GITHUB_WORKSPACE/source/bootstrap.sh" \
            --archive "$archive" --sha256 "$(sha256sum "$archive" | cut -d' ' -f1)" \
            --source "$SOURCE" --version "$VERSION" --platform "$TARGET" \
            --old-archive "$RUNNER_TEMP/old-result/sender-$TARGET.tar.gz" \
            --old-sha256 "$(sha256sum "$old" | cut -d' ' -f1)" --old-source "$OLD_SOURCE" --old-version 0.0.1 \
            --output "$RUNNER_TEMP/acceptance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: sender-acceptance-${{ inputs.platform }}-${{ inputs.source }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: warn
          retention-days: 3
      - name: Exercise compiled PVE install, MQTT and rollback
        if: inputs.platform == 'linux-x64'
        run: |
          set -eu
          image="$RUNNER_TEMP/debian-pve.qcow2"
          image_sha=5bd891c6e62d01639f52a5587b72a4607421e445732214be787dba6043cf9797a6ff90bed982aada6a6c7e619f1f956d961c4fad76757171abd607920aac098a
          curl --fail --location --retry 3 https://cloud.debian.org/images/cloud/trixie/20261026-2643/debian-13-generic-amd64-20261026-2643.qcow2 -o "$image"
          printf '%s  %s\n' "$image_sha" "$image" | sha512sum -c -
          archive="$RUNNER_TEMP/private/assets/sender-$TARGET.tar.gz"
          old="$RUNNER_TEMP/old-result/sender-$TARGET.tar.gz"
          bootstrap="$GITHUB_WORKSPACE/source/bootstrap.sh"
          python3 scripts/release-tests/pve_acceptance.py --bootstrap "$bootstrap" \
            --bootstrap-sha256 "$(sha256sum "$bootstrap" | cut -d' ' -f1)" \
            --archive "$archive" --sha256 "$(sha256sum "$archive" | cut -d' ' -f1)" \
            --source "$SOURCE" --version "$VERSION" --old-archive "$old" \
            --old-sha256 "$(sha256sum "$old" | cut -d' ' -f1)" --old-source "$OLD_SOURCE" --old-version 0.0.1 \
            --cloud-image "$image" --cloud-image-sha512 "$image_sha" --output "$RUNNER_TEMP/pve-acceptance"
      - name: Retain non-secret PVE evidence identities
        if: ${{ always() && inputs.platform == 'linux-x64' }}
        run: |
          set -eu
          if [ -d "$RUNNER_TEMP/pve-acceptance/diagnostics" ]; then
            cp -r "$RUNNER_TEMP/pve-acceptance/diagnostics" "$RUNNER_TEMP/pve-summary"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && inputs.platform == 'linux-x64' }}
        with:
          name: sender-pve-summary-${{ inputs.source }}
          path: ${{ runner.temp }}/pve-summary
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: sender-${{ inputs.platform }}-${{ inputs.source }}
          path: ${{ runner.temp }}/private
          if-no-files-found: error
          retention-days: 3
