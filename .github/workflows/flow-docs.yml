name: Flow docs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  flow-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate affected flows against the event base
        env:
          FLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [[ "$FLOW_BASE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$FLOW_BASE" != 0000000000000000000000000000000000000000 ]]
          python3 tools/flow-docs/flow_checker.py explain --base "$FLOW_BASE"
          python3 tools/flow-docs/flow_checker.py check --base "$FLOW_BASE"
